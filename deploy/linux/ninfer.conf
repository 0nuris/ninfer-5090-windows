# NInfer 512K deployment settings. Every script in this folder reads this file (bash syntax:
# KEY=value, no spaces around "="). Relative paths resolve against this file's folder.

# Engine and model. A release tarball ships bin/; from a source checkout use an absolute path
# such as /opt/src/ninfer/build/apps/ninfer-serve.
EXE="bin/ninfer-serve"
MODEL="models/qwen3_8_27b_nvfp4full.v3.ninfer"
LOGS="logs"
KEEP_LOGS=20                  # rotated ninfer-<timestamp>.err/.out files to keep

# Network. 127.0.0.1 serves this machine only. To serve other devices, set this machine's LAN
# or VPN address and allow inbound TCP to PORT in your firewall (see README.md). There is no
# API key; anything that can reach the port can use the model.
BIND_ADDRESS="127.0.0.1"
PORT=8088
MODEL_ID="qwen3.8-27b-nvfp4-yarn512k"   # clients send this as "model"

# Context. Above 262,144 (the model's native length) YaRN is enabled with
# factor = MAX_CONTEXT / 262144 (at most 2). 524,288 needs nvfp4 KV to fit on 32 GB.
# Set 262144 with KV_DTYPE=fp8, SPEC=dflash2, DRAFT_TOKENS=7 for upstream's native profile.
MAX_CONTEXT=524288
KV_DTYPE="nvfp4"
SPEC="mtp"                    # DFlash/DFlash2 are refused when MAX_CONTEXT > 262144
DRAFT_TOKENS=5                # MTP depth 5 is the measured best for this artifact

# Concurrency: requests generated at once, sharing one KV pool. 3 was measured to fit at
# 524,288 on an RTX 5090 (Windows) and helps parallel agents with contexts up to ~90k each;
# with 140k+ contexts each, concurrent requests evict each other's cache and run slower than
# serial. 1 is the safe default.
CONCURRENCY=1

# Pinned host cache (system RAM) for conversations evicted from VRAM. State slots cost
# ~150 MiB each. Lower HOST_KV_MIB if startup fails pinning it.
HOST_STATE_SLOTS=8
HOST_KV_MIB=8192

# Reasoning cap per request (tokens); clients can override per request.
THINKING_BUDGET=4096

# Typical VRAM use of this profile (GiB), for start-ninfer.sh's advisory warning only; the
# engine itself decides whether the profile fits.
NEED_VRAM_GIB=29.5
